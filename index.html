<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aiflowix</title>
  <link rel="stylesheet" href="css/main.css" />
  
</head>
<body>

  <header class="site-header">
    <div class="header-top">
      <h1 class="animated-title">
        Aiflowix
        <span class="hover-text" data-text="Aiflowix">Aiflowix</span>
      </h1>

      <div class="header-actions">
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Abrir menú" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <button class="theme-toggle" id="theme-toggle" aria-label="Cambiar tema">
          🌙
        </button>
      </div>
    </div>
    <!-- data-link marca estos como navegación interna de la SPA -->
    <nav class="main-nav" id="main-nav">
      <a href="/" class="nav-btn">Home</a>
      <a href="/characters" class="nav-btn">Personajes</a>
      <a href="/about" class="nav-btn">About</a>
    </nav>

    <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
      <a href="/" class="mobile-menu-btn">Home</a>
      <a href="/characters" class="mobile-menu-btn">Personajes</a>
      <a href="/about" class="mobile-menu-btn">About</a>
    </div>
  </header>

  <!-- Este es el único contenedor que JavaScript va a reescribir -->
  <main id="app"></main>

  <!-- Footer: marca el final de la página (límite al hacer scroll) -->
  <footer class="site-footer">
    <p class="footer-text">© 2026 Aiflowix — Guillermo Cely · Proyecto M3</p>
  </footer>

  <!-- Módulo ES6 como punto de entrada -->
  <script type="module" src="src/main.js"></script>
   <!-- Water ripple effect (solo en desktop con mouse para evitar puntos blancos y problemas de scroll en móvil) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="jquery.ripples.min.js"></script>
  <script>
    jQuery(document).ready(function( $ ) {
        var esDesktop = window.matchMedia('(min-width: 768px) and (pointer: fine)').matches;
        if (esDesktop) {
            $('body').ripples({
                resolution: 512,
                dropRadius: 20,
                perturbance: 0.04,
                interactive: true
            });
        }
    });
  </script>
</body>
</html>
